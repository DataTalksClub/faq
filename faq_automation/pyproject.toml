[project]
name = "faq-automation"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "minsearch>=0.0.7",
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "python-frontmatter>=1.0.0",
    "pyyaml>=6.0.2",
]

[dependency-groups]
dev = [
    "website-generator",
    "pytest>=8.4.2",
    "pytest-mock>=3.10.0",
]

[tool.uv]
exclude-newer = "7 days"
package = false

[tool.uv.sources]
website-generator = { path = "../website" }

[tool.pytest.ini_options]
pythonpath = ["..", "../website"]
testpaths = ["tests", "tests_integration"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "integration: Integration tests for FAQ workflows"
]
