name: FAQ Automation

on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Open FAQ issue number to process
        type: number
        required: true

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

concurrency:
  group: faq-automation-${{ inputs.issue_number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  process-faq-proposal:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (contains(github.event.issue.labels.*.name, 'faq-proposal') &&
      (github.event.action != 'labeled' || github.event.label.name == 'faq-proposal'))
    runs-on: ubuntu-latest
    env:
      ISSUE_NUMBER: ${{ inputs.issue_number || github.event.issue.number }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        working-directory: ./faq_automation
        run: uv sync --no-dev

      - name: Fetch issue body
        id: fetch_issue
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            if (!Number.isInteger(issueNumber) || issueNumber < 1) {
              throw new Error('A valid issue_number is required');
            }
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });
            if (issue.state !== 'open') {
              throw new Error(`Issue #${issueNumber} is not open`);
            }
            const body = issue.body || '';

            // Save issue body to file for Python to parse
            const fs = require('fs');
            fs.writeFileSync('/tmp/issue_body.txt', body);
            fs.writeFileSync('/tmp/issue_title.txt', issue.title || '');
            fs.writeFileSync('/tmp/issue_number.txt', String(issueNumber));

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const relatedIssues = issues.filter(issue =>
              issue.number !== issueNumber && !issue.pull_request
            );
            fs.writeFileSync('/tmp/related_issues.json', JSON.stringify(relatedIssues));

            console.log(`Fetched issue body and ${relatedIssues.length} other open issues`);

      - name: Process FAQ with AI
        id: process
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPIK_URL_OVERRIDE: https://www.comet.com/opik/api
          OPIK_WORKSPACE: default
          OPIK_PROJECT_NAME: faq-automation-ci
          OPIK_API_KEY: ${{ secrets.OPIK_API_KEY }}
        run: |
          # Run FAQ automation CLI with full issue body.
          # No --model: the default in rag_agent.py is the single source of truth,
          # so production and the evals cannot drift apart. See docs/model-choice.md.
          uv run --project faq_automation python -m faq_automation.cli \
            --issue-body "$(cat /tmp/issue_body.txt)" \
            --issue-title "$(cat /tmp/issue_title.txt)" \
              --issue-number "$ISSUE_NUMBER" \
            --related-issues-file /tmp/related_issues.json \
            --output-dir /tmp

          # Write decision output to GitHub Actions
          uv run --project faq_automation python scripts/write_faq_decision_output.py

      - name: Handle NEW or UPDATE action
        if: fromJson(steps.process.outputs.decision).action == 'NEW' || fromJson(steps.process.outputs.decision).action == 'UPDATE'
        uses: actions/github-script@v7
        env:
          DECISION_JSON: ${{ steps.process.outputs.decision }}
        with:
          script: |
            const decision = JSON.parse(process.env.DECISION_JSON);
            const action = decision.action;
            const issueNumber = decision.issue_number;
            const issueTitle = decision.issue_title;
            const prBody = decision.pr_body;
            const filePath = decision.file_path;

            // Create branch name
            const branchName = `faq-bot/issue-${issueNumber}`;

            // Repeated issue events should not open another PR for this issue.
            const existingPRs = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:${branchName}`,
              base: 'main',
            });
            if (existingPRs.length > 0) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                title: issueTitle,
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: `A FAQ proposal PR is already open: #${existingPRs[0].number}.`,
              });
              return;
            }

            // Configure git
            await exec.exec('git', ['config', 'user.name', 'FAQ Bot']);
            await exec.exec('git', ['config', 'user.email', 'faq-bot@datatalks.club']);

            // Fetch and checkout main, then create new branch from it
            await exec.exec('git', ['fetch', 'origin', 'main']);
            await exec.exec('git', ['checkout', 'main']);
            await exec.exec('git', ['checkout', '-b', branchName]);

            // Add modified files
            await exec.exec('git', ['add', filePath]);

            // Commit changes
            const commitMsg = `${action}: ${decision.decision.question.substring(0, 72)}`;
            await exec.exec('git', ['commit', '-m', commitMsg]);

            // Push branch
            await exec.exec('git', ['push', 'origin', branchName]);

            // Create pull request
            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[FAQ Bot] ${action}: ${decision.decision.question.substring(0, 72)}`,
              head: branchName,
              base: 'main',
              body: `${prBody}\n\nCloses #${issueNumber}`
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              title: issueTitle,
            });

            // PR events created with GITHUB_TOKEN require manual approval.
            // Dispatch the content test on the PR branch for an automatic CI result.
            try {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'test-website.yml',
                ref: branchName,
              });
            } catch (error) {
              core.warning(`Could not dispatch FAQ content tests: ${error.message}`);
            }

            // Comment on issue with PR link
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `✅ FAQ ${action} proposal created in PR #${pr.number}\n\nPlease review and approve the changes.`
            });

      - name: Handle DUPLICATE action
        if: fromJson(steps.process.outputs.decision).action == 'DUPLICATE'
        uses: actions/github-script@v7
        env:
          DECISION_JSON: ${{ steps.process.outputs.decision }}
        with:
          script: |
            const decision = JSON.parse(process.env.DECISION_JSON);
            const comment = decision.comment;
            const issueNumber = decision.issue_number;

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              title: decision.issue_title,
            });

            // Post comment
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: comment
            });

            // Close issue
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              state: 'closed',
              state_reason: 'completed'
            });

      - name: Handle INVALID_PROPOSAL action
        if: fromJson(steps.process.outputs.decision).action == 'INVALID_PROPOSAL'
        uses: actions/github-script@v7
        env:
          DECISION_JSON: ${{ steps.process.outputs.decision }}
        with:
          script: |
            const decision = JSON.parse(process.env.DECISION_JSON);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: decision.issue_number,
              body: decision.comment,
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: decision.issue_number,
              state: 'closed',
              state_reason: 'not_planned',
            });

      - name: Handle DUPLICATE_SUBMISSION action
        if: fromJson(steps.process.outputs.decision).action == 'DUPLICATE_SUBMISSION'
        uses: actions/github-script@v7
        env:
          DECISION_JSON: ${{ steps.process.outputs.decision }}
        with:
          script: |
            const decision = JSON.parse(process.env.DECISION_JSON);
            const issueNumber = decision.issue_number;

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              title: decision.issue_title,
            });
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: decision.comment,
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              state: 'closed',
              state_reason: 'not_planned',
            });

      - name: Handle WRONG_COURSE action
        if: fromJson(steps.process.outputs.decision).action == 'WRONG_COURSE'
        uses: actions/github-script@v7
        env:
          DECISION_JSON: ${{ steps.process.outputs.decision }}
        with:
          script: |
            const decision = JSON.parse(process.env.DECISION_JSON);
            const comment = decision.comment;
            const issueNumber = decision.issue_number;

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              title: decision.issue_title,
            });

            // Post comment
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: comment
            });

            // Close issue — the proposal was never actionable for this course
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              state: 'closed',
              state_reason: 'not_planned'
            });

      - name: Handle errors
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `❌ FAQ Bot encountered an error processing this proposal.\n\nPlease check the [workflow run](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for details.\n\nA maintainer will review this manually.`
            });
