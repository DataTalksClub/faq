[project]
name = "website-generator"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "jinja2>=3.1.6",
    "mistune>=3.0.0",
    "pygments>=2.19.2",
    "python-docx>=1.2.0",
    "pyyaml>=6.0.2",
    "requests>=2.32.5",
    "minsearch>=0.0.7",
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "python-frontmatter>=1.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-mock>=3.10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests", "tests_integration"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "integration: Integration tests that build the full site"
]
